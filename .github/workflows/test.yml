name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  # synthetic talk video -> real whisper/ffmpeg/opencv pipeline -> 1080x1920 clips + MCP handshake
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
      - run: python -m pip install --prefer-binary -r requirements.txt
      - run: python tests/e2e.py --model tiny
